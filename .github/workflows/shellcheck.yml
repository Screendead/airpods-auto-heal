name: ShellCheck

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: Run ShellCheck
        run: |
          shellcheck -s bash install.sh uninstall.sh templates/*.sh tests/smoke.sh

      - name: Run smoke checks
        run: |
          ./tests/smoke.sh
